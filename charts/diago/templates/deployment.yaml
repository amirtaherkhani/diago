{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "Diago currently requires replicaCount: 1 because MCP sessions are stored in process memory." }}
{{- end }}
{{- if and .Values.ingress.enabled (not .Values.auth.existingSecret) }}
{{- fail "ingress.enabled requires auth.existingSecret so the MCP endpoint is not exposed without authentication." }}
{{- end }}
{{- if and (ne .Values.service.type "ClusterIP") (not .Values.auth.existingSecret) }}
{{- fail "service.type NodePort or LoadBalancer requires auth.existingSecret so the MCP endpoint is not exposed without authentication." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diago.fullname" . }}
  labels:
    {{- include "diago.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "diago.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "diago.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "diago.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: diago
          image: {{ include "diago.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: DIAGO_OUTPUT_ROOT
              value: /data
            - name: DIAGO_ALLOWED_ORIGINS
              value: {{ join "," .Values.mcp.allowedOrigins | quote }}
            - name: DIAGO_MAX_BODY_BYTES
              value: {{ printf "%.0f" .Values.mcp.maxBodyBytes | quote }}
            - name: DIAGO_MAX_SESSIONS
              value: {{ printf "%.0f" .Values.mcp.maxSessions | quote }}
            - name: DIAGO_SESSION_TTL_MS
              value: {{ printf "%.0f" .Values.mcp.sessionTtlMs | quote }}
            {{- with .Values.auth.existingSecret }}
            - name: DIAGO_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.auth.secretKey | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: output
              mountPath: /data
      volumes:
        - name: temporary
          emptyDir: {}
        - name: output
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "diago.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
