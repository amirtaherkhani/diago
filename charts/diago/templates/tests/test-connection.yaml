apiVersion: v1
kind: Pod
metadata:
  name: {{ include "diago.fullname" . }}-test-connection
  labels:
    {{- include "diago.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: mcp-smoke
      image: {{ include "diago.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - node
        - --input-type=module
        - --eval
        - |
          const base = 'http://{{ include "diago.fullname" . }}:{{ .Values.service.port }}';
          const headers = {
            Accept: 'application/json, text/event-stream',
            'Content-Type': 'application/json',
            {{- if .Values.auth.existingSecret }}
            Authorization: `Bearer ${process.env.DIAGO_BEARER_TOKEN}`,
            {{- end }}
          };
          const ready = await fetch(`${base}/readyz`);
          if (!ready.ok) throw new Error(`readiness returned ${ready.status}`);
          const response = await fetch(`${base}/mcp`, {
            method: 'POST',
            headers,
            body: JSON.stringify({
              jsonrpc: '2.0',
              id: 1,
              method: 'initialize',
              params: {
                protocolVersion: '2025-11-25',
                capabilities: {},
                clientInfo: { name: 'helm-test', version: '1.0.0' },
              },
            }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(`initialize returned ${response.status}`);
          if (!response.headers.get('mcp-session-id')) throw new Error('missing MCP session');
          if (payload.result?.protocolVersion !== '2025-11-25') {
            throw new Error('unexpected MCP protocol version');
          }
      {{- with .Values.auth.existingSecret }}
      env:
        - name: DIAGO_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ . | quote }}
              key: {{ $.Values.auth.secretKey | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
